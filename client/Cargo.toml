[package]
name = "pumpkinpi-client"
version.workspace = true
edition.workspace = true

[[bin]]
name = "pumpkinpi"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
chrono = "0.4"
dioxus = { version = "=0.8.0-alpha.1", default-features = false, features = ["macro", "html", "signals", "hooks"] }
dioxus-native = { version = "=0.8.0-alpha.1", default-features = false, features = ["accessibility", "clipboard", "incremental", "scrollbars", "system-fonts", "vello-hybrid"] }
futures-util.workspace = true
pumpkinpi-protocol.workspace = true
rfd = "0.17"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
